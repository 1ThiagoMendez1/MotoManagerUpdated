name: motomanager-cache

# Deploy beside the EXISTING application/Supabase stack. No new database.
services:
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random hexadecimal password in Dokploy}
    command:
      - /bin/sh
      - -ec
      - |
        test "$${#REDIS_PASSWORD}" -ge 64 || exit 1
        case "$$REDIS_PASSWORD" in *[!a-fA-F0-9]*) exit 1;; esac
        umask 077
        printf '%s\n' 'bind 0.0.0.0' 'protected-mode yes' 'appendonly no' 'save ""' 'maxmemory 256mb' 'maxmemory-policy allkeys-lru' > /tmp/redis.conf
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" >> /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      application:
        aliases: [motomanager-read-cache]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  application:
    external: true
    name: ${MOTOMANAGER_NETWORK:?Set the existing private Docker network shared by the application}
